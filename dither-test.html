<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=800,height=480,initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <meta name="color-scheme" content="light" />
  <meta name="referrer" content="no-referrer" />
  <title>E1002 Spectra 6 dither test</title>
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      --cold: #0000ff;
      --hot: #ff0000;
    }

    html,
    body {
      width: 800px;
      height: 480px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    #screen {
      width: 800px;
      height: 480px;
      display: grid;
      grid-template-rows: 32px 367px 79px;
      gap: 1px;
      padding: 1px;
      background: var(--ink);
      overflow: hidden;
    }

    header,
    #stage,
    #status {
      min-width: 0;
      min-height: 0;
      background: var(--paper);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 12px;
      padding: 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    #stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--ink);
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 24px 1fr;
      background: var(--paper);
      overflow: hidden;
    }

    .paneTitle {
      display: flex;
      align-items: center;
      padding: 0 6px;
      border-bottom: 1px solid var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--paper);
      image-rendering: auto;
    }

    #status {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--ink);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
    }

    .metric {
      min-width: 0;
      padding: 5px 6px;
      background: var(--paper);
      overflow: hidden;
    }

    .metric span {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      line-height: 1;
    }

    .yes {
      color: var(--cold);
    }

    .no,
    .error {
      color: var(--hot);
    }
  </style>
</head>
<body>
  <div id="screen">
    <header>
      <div>Spectra 6 dither test</div>
      <div id="imageIndex">--/--</div>
    </header>

    <main id="stage" aria-label="Original and dithered preview">
      <section class="pane" aria-label="Original preview">
        <div class="paneTitle">Original crop</div>
        <canvas id="sourceCanvas" width="399" height="342"></canvas>
      </section>
      <section class="pane" aria-label="Dithered preview">
        <div class="paneTitle">Spectra 6 device colors</div>
        <canvas id="deviceCanvas" width="399" height="342"></canvas>
      </section>
    </main>

    <footer id="status" aria-label="Dither status">
      <div class="metric">Input palette-only<span id="inputPalette">--</span></div>
      <div class="metric">Output palette-only<span id="outputPalette">--</span></div>
      <div class="metric">Processing<span id="processingTime">-- ms</span></div>
      <div class="metric">State<span id="stateText">Loading</span></div>
    </footer>
  </div>

  <script type="module">
    'use strict';

    import {
      ditherImage,
      replaceColors,
      aitjcizeSpectra6Palette
    } from 'https://esm.sh/epdoptimize@1.0.3';

    const SOURCE_WIDTH = 399;
    const SOURCE_HEIGHT = 342;
    const paletteColors = new Set(
      aitjcizeSpectra6Palette.map((entry) => entry.deviceColor.toLowerCase())
    );

    const $ = (id) => document.getElementById(id);

    function setMetric(id, value, ok) {
      const el = $(id);
      if (!el) return;
      el.textContent = value;
      el.className = ok === true ? 'yes' : ok === false ? 'no' : '';
    }

    function hexFromRgb(r, g, b) {
      return `#${[r, g, b].map((value) => value.toString(16).padStart(2, '0')).join('')}`;
    }

    function isPaletteOnly(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let outside = 0;

      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] === 0) continue;
        if (!paletteColors.has(hexFromRgb(data[i], data[i + 1], data[i + 2]))) outside += 1;
      }

      return {
        paletteOnly: outside === 0,
        outsidePixels: outside
      };
    }

    function imageUrlFromEntry(prefix, entry) {
      if (/^https?:\/\//i.test(entry)) return entry;
      return `${prefix || ''}${entry}`;
    }

    async function loadImage(url) {
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.src = url;

      await image.decode();
      return image;
    }

    function drawCoverImage(canvas, image) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const scale = Math.max(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
      const width = image.naturalWidth * scale;
      const height = image.naturalHeight * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, x, y, width, height);
    }

    function copyCanvas(source, destination) {
      const ctx = destination.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, destination.width, destination.height);
      ctx.drawImage(source, 0, 0);
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const selectedIndex = Math.max(0, Number(params.get('i')) || 0);
      const imageList = await fetch('./images.json', { cache: 'no-store' }).then((response) => {
        if (!response.ok) throw new Error(`images.json HTTP ${response.status}`);
        return response.json();
      });

      const images = Array.isArray(imageList.images) ? imageList.images : [];
      if (!images.length) throw new Error('images.json has no images');

      const index = selectedIndex % images.length;
      $('imageIndex').textContent = `${index + 1}/${images.length}`;

      const image = await loadImage(imageUrlFromEntry(imageList.prefix, images[index]));
      const sourceCanvas = $('sourceCanvas');
      const deviceCanvas = $('deviceCanvas');
      const ditheredCanvas = document.createElement('canvas');
      ditheredCanvas.width = SOURCE_WIDTH;
      ditheredCanvas.height = SOURCE_HEIGHT;

      drawCoverImage(sourceCanvas, image);

      const inputStats = isPaletteOnly(sourceCanvas);
      setMetric('inputPalette', inputStats.paletteOnly ? 'YES' : 'NO', inputStats.paletteOnly);

      const startedAt = performance.now();
      if (inputStats.paletteOnly) {
        copyCanvas(sourceCanvas, deviceCanvas);
      } else {
        await ditherImage(sourceCanvas, ditheredCanvas, {
          palette: aitjcizeSpectra6Palette,
          processingPreset: 'balanced',
          ditheringType: 'errorDiffusion',
          errorDiffusionMatrix: 'floydSteinberg',
          serpentine: true,
          colorMatching: 'lab'
        });
        replaceColors(ditheredCanvas, deviceCanvas, aitjcizeSpectra6Palette);
      }

      const elapsed = Math.round(performance.now() - startedAt);
      const outputStats = isPaletteOnly(deviceCanvas);
      setMetric('outputPalette', outputStats.paletteOnly ? 'YES' : 'NO', outputStats.paletteOnly);
      setMetric('processingTime', `${elapsed} ms`);
      setMetric('stateText', inputStats.paletteOnly ? 'Would skip' : 'Dithered', !inputStats.paletteOnly);
    }

    main().catch((error) => {
      setMetric('stateText', error.message || 'Error', false);
      $('stateText').className = 'error';
    });
  </script>
</body>
</html>
