<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Iceland Image</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: relative;
    }

    img {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img
    id="random-image"
    src="./assets/photos/iceland-001.png"
    alt="Random Iceland landscape"
    fetchpriority="high"
    decoding="sync"
  />

  <script>
    const img = document.getElementById("random-image");

    async function loadImages() {
      const response = await fetch("./optimized-images.json", { cache: "no-cache" });

      if (!response.ok) {
        throw new Error(`Photo manifest failed: ${response.status}`);
      }

      const manifest = await response.json();
      const images = Array.isArray(manifest.images) ? manifest.images : [];
      return images.map((image) => image.src).filter(Boolean);
    }

    function showImage(src) {
      if (!src || img.getAttribute("src") === src) return;

      const nextImage = new Image();
      nextImage.decoding = "sync";
      nextImage.onload = () => {
        img.src = src;
      };
      nextImage.src = src;
    }

    loadImages()
      .then((images) => {
        if (images.length === 0) {
          throw new Error("Photo manifest is empty");
        }

        showImage(images[Math.floor(Math.random() * images.length)]);
      })
      .catch((error) => {
        console.error(error);
        document.body.style.background = "#fff";
      });
  </script>
</body>
</html>
