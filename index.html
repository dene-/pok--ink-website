<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Iceland Image</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      position: relative;
    }

    img {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <script>
    const PHOTO_COUNT = 669;
    const selectedPhoto = String(Math.floor(Math.random() * PHOTO_COUNT) + 1).padStart(3, "0");
    const selectedSrc = `./assets/photos/iceland-${selectedPhoto}.png`;

    document.write(
      `<img id="random-image" src="${selectedSrc}" alt="Random Iceland landscape" fetchpriority="high" decoding="sync" />`
    );
  </script>
  <noscript>
    <img
      id="random-image"
      src="./assets/photos/iceland-001.png"
      alt="Random Iceland landscape"
      fetchpriority="high"
      decoding="sync"
    />
  </noscript>
</body>
</html>
