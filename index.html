<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex Archive</title>
  <style>
    :root {
      --paper-bg: #ffffff;
      --ink: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #242424;
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .frame {
      width: 800px;
      height: 480px;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: var(--paper-bg);
      box-shadow: 0 0 0 1px #000;
    }

    canvas {
      display: block;
      width: 800px;
      height: 480px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--paper-bg);
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="Pokédex display">
    <canvas id="display" width="800" height="480"></canvas>
  </main>

  <script>
    const W = 800;
    const H = 480;
    const canvas = document.getElementById("display");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const PALETTE = [
      [255, 255, 255],
      [0, 0, 0],
      [255, 0, 0],
      [0, 255, 0],
      [0, 0, 255]
    ];

    const UI = {
      white: "#ffffff",
      paper: "#f7f7f1",
      black: "#000000",
      red: "#ff0000",
      green: "#00ff00",
      blue: "#0000ff"
    };

    const typeColors = {
      normal: UI.black,
      fire: UI.red,
      water: UI.blue,
      electric: UI.red,
      grass: UI.green,
      ice: UI.blue,
      fighting: UI.red,
      poison: UI.blue,
      ground: UI.black,
      flying: UI.blue,
      psychic: UI.red,
      bug: UI.green,
      rock: UI.black,
      ghost: UI.blue,
      dragon: UI.blue,
      dark: UI.black,
      steel: UI.blue,
      fairy: UI.red
    };

    const statLabels = {
      hp: "HP",
      attack: "ATK",
      defense: "DEF",
      "special-attack": "SAT",
      "special-defense": "SDF",
      speed: "SPD"
    };

    function px(value) {
      return Math.round(value);
    }

    function clear() {
      ctx.fillStyle = UI.white;
      ctx.fillRect(0, 0, W, H);
    }

    function rect(x, y, w, h, fill = UI.white, stroke = UI.black, lineWidth = 2) {
      x = px(x); y = px(y); w = px(w); h = px(h);
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      if (stroke && lineWidth > 0) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = stroke;
        ctx.strokeRect(x + lineWidth / 2, y + lineWidth / 2, w - lineWidth, h - lineWidth);
      }
    }

    function line(x1, y1, x2, y2, color = UI.black, width = 2) {
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.moveTo(px(x1) + 0.5, px(y1) + 0.5);
      ctx.lineTo(px(x2) + 0.5, px(y2) + 0.5);
      ctx.stroke();
      ctx.restore();
    }

    function circle(x, y, r, fill = UI.white, stroke = UI.black, lineWidth = 2) {
      ctx.beginPath();
      ctx.arc(px(x), px(y), px(r), 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke && lineWidth > 0) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }

    function label(text, x, y, size = 18, color = UI.black, align = "left", weight = 700) {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ui-monospace, Menlo, Consolas, monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = "top";
      ctx.fillText(text, px(x), px(y));
    }

    function fitText(text, x, y, maxWidth, size, color = UI.black, align = "left", weight = 700) {
      let fontSize = size;
      ctx.font = `${weight} ${fontSize}px ui-monospace, Menlo, Consolas, monospace`;
      while (ctx.measureText(text).width > maxWidth && fontSize > 11) {
        fontSize -= 1;
        ctx.font = `${weight} ${fontSize}px ui-monospace, Menlo, Consolas, monospace`;
      }
      label(text, x, y, fontSize, color, align, weight);
    }

    function titleCase(text) {
      return String(text)
        .split("-")
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function padId(id) {
      return `#${String(id).padStart(4, "0")}`;
    }

    function wrapText(text, x, y, maxWidth, lineHeight, maxLines, size = 15, color = UI.black) {
      const words = text.replace(/\s+/g, " ").trim().split(" ");
      let lineText = "";
      let lines = [];
      ctx.font = `700 ${size}px ui-monospace, Menlo, Consolas, monospace`;

      for (const word of words) {
        const testLine = lineText ? `${lineText} ${word}` : word;
        if (ctx.measureText(testLine).width > maxWidth && lineText) {
          lines.push(lineText);
          lineText = word;
        } else {
          lineText = testLine;
        }
      }
      if (lineText) lines.push(lineText);
      lines = lines.slice(0, maxLines);

      if (lines.length === maxLines && words.length > 0) {
        let last = lines[maxLines - 1];
        while (ctx.measureText(`${last}...`).width > maxWidth && last.length > 0) {
          last = last.slice(0, -1);
        }
        lines[maxLines - 1] = `${last}...`;
      }

      lines.forEach((lineText, i) => label(lineText, x, y + i * lineHeight, size, color, "left", 700));
    }

    function statChip(name, value, x, y, width) {
      const labelWidth = 30;
      const valueWidth = 34;
      const barX = x + labelWidth + 6;
      const barW = width - labelWidth - valueWidth - 14;
      const normalized = Math.min(value, 180) / 180;
      const fillWidth = Math.max(3, Math.round((barW - 2) * normalized));
      const barColor = value >= 90 ? UI.green : value >= 55 ? UI.blue : UI.red;

      label(name, x, y + 1, 13, UI.black, "left", 900);
      rect(barX, y + 3, barW, 11, UI.white, UI.black, 1);
      ctx.fillStyle = barColor;
      ctx.fillRect(px(barX + 1), px(y + 4), fillWidth, 9);
      label(String(value).padStart(3, "0"), x + width, y, 13, UI.black, "right", 900);
    }

    function drawShell() {
      clear();

      rect(0, 0, W, H, UI.red, UI.black, 0);
      rect(18, 18, 764, 444, UI.white, UI.black, 4);
      rect(34, 34, 732, 58, UI.red, UI.black, 0);
      line(34, 92, 766, 92, UI.black, 4);

      circle(70, 63, 24, UI.blue, UI.black, 4);
      circle(70, 63, 12, UI.white, null, 0);
      circle(122, 50, 8, UI.red, UI.black, 2);
      circle(148, 50, 8, UI.green, UI.black, 2);
      circle(174, 50, 8, UI.blue, UI.black, 2);

      label("POKÉDEX", 238, 51, 26, UI.white, "left", 900);
      label("SPECIES ARCHIVE", 572, 55, 16, UI.white, "left", 900);

      rect(42, 110, 348, 336, UI.black, UI.black, 0);
      rect(54, 122, 324, 312, UI.white, UI.black, 3);
      rect(74, 142, 284, 216, UI.paper, UI.black, 3);
      rect(74, 374, 284, 44, UI.white, UI.black, 3);
      circle(96, 396, 10, UI.red, UI.black, 2);

      line(402, 102, 402, 448, UI.black, 4);
      line(396, 138, 408, 138, UI.black, 4);
      line(396, 418, 408, 418, UI.black, 4);

      rect(420, 110, 342, 336, UI.paper, UI.black, 4);
      rect(438, 128, 306, 82, UI.white, UI.black, 3);
      rect(438, 220, 306, 88, UI.white, UI.black, 3);
      rect(438, 320, 306, 106, UI.white, UI.black, 3);
    }

    function drawLoading() {
      drawShell();
      label("SEARCHING...", 452, 144, 24, UI.black, "left", 900);
      wrapText("Fetching Pokémon data and preparing the species file.", 452, 244, 260, 22, 3, 17);
      label("PLEASE STAND BY", 452, 340, 18, UI.blue, "left", 900);
    }

    function drawError(message) {
      drawShell();
      label("SIGNAL LOST", 452, 144, 26, UI.red, "left", 900);
      wrapText(message || "Could not load Pokémon data. Reload the page to try again.", 452, 244, 260, 22, 3, 17);
      label("RELOAD PAGE", 452, 340, 18, UI.black, "left", 900);
      safeApplyAtkinsonDither();
    }

    function imageCandidates(sprites, pokemonId) {
      const urls = [
        // Tiny sprite is usually the most reliable on low-power browsers.
        `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`,
        sprites?.front_default,
        sprites?.other?.["official-artwork"]?.front_default,
        sprites?.other?.home?.front_default
      ];

      return urls.filter((url, index, arr) => Boolean(url) && arr.indexOf(url) === index);
    }

    function imageFromUrl(url) {
      return new Promise((resolve, reject) => {
        if (!url) return reject(new Error("No sprite available"));
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function imageFromUrlWithTimeout(url, timeoutMs = 3000) {
      return Promise.race([
        imageFromUrl(url),
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error("Image load timeout")), timeoutMs);
        })
      ]);
    }

    async function loadFirstAvailableImage(urls, timeoutMs = 3500) {
      for (const url of urls) {
        try {
          return await imageFromUrlWithTimeout(url, timeoutMs);
        } catch {
          // Try the next candidate URL.
        }
      }
      return null;
    }

    function drawPokemonSilhouetteFallback(name) {
      circle(216, 247, 82, UI.white, UI.black, 4);
      circle(186, 222, 15, UI.black, null, 0);
      circle(248, 222, 15, UI.black, null, 0);
      rect(174, 278, 88, 14, UI.black, null, 0);
      fitText(titleCase(name), 216, 391, 172, 17, UI.black, "center", 900);
    }

    function drawPokemonImage(img, speciesName) {
      rect(74, 142, 284, 216, UI.paper, UI.black, 3);
      const maxW = 230;
      const maxH = 194;
      const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
      const drawW = Math.round(img.naturalWidth * scale);
      const drawH = Math.round(img.naturalHeight * scale);
      const x = Math.round(74 + (284 - drawW) / 2);
      const y = Math.round(144 + (216 - drawH) / 2);
      ctx.drawImage(img, x, y, drawW, drawH);
      fitText(titleCase(speciesName), 216, 391, 172, 17, UI.black, "center", 900);
    }

    function drawTypes(types) {
      let x = 452;
      types.slice(0, 2).forEach(typeInfo => {
        const type = typeInfo.type.name;
        const text = type.toUpperCase();
        const w = Math.min(126, Math.max(86, text.length * 12 + 20));
        rect(x, 176, w, 26, typeColors[type] || UI.black, UI.black, 2);
        label(text, x + w / 2, 182, 13, UI.white, "center", 900);
        x += w + 10;
      });
    }

    function drawStats(stats) {
      const statMap = stats.reduce((map, entry) => {
        map[entry.stat.name] = entry.base_stat;
        return map;
      }, {});

      label("BASE STATS", 452, 332, 15, UI.red, "left", 900);
      statChip("HP", statMap.hp || 0, 452, 356, 126);
      statChip("ATK", statMap.attack || 0, 452, 378, 126);
      statChip("DEF", statMap.defense || 0, 452, 400, 126);
      statChip("SAT", statMap["special-attack"] || 0, 598, 356, 126);
      statChip("SDF", statMap["special-defense"] || 0, 598, 378, 126);
      statChip("SPD", statMap.speed || 0, 598, 400, 126);
    }

    function drawInfo(pokemon, species, img) {
      drawShell();

      if (img) {
        try {
          drawPokemonImage(img, pokemon.name);
        } catch {
          drawPokemonSilhouetteFallback(pokemon.name);
        }
      } else {
        drawPokemonSilhouetteFallback(pokemon.name);
      }

      const name = titleCase(pokemon.name);
      fitText(name, 452, 140, 188, 28, UI.black, "left", 900);
      label(padId(pokemon.id), 724, 144, 19, UI.red, "right", 900);
      drawTypes(pokemon.types);

      const heightM = (pokemon.height / 10).toFixed(1);
      const weightKg = (pokemon.weight / 10).toFixed(1);
      label("HEIGHT", 452, 238, 14, UI.black, "left", 900);
      label(`${heightM} m`, 548, 238, 15, UI.blue, "left", 900);
      label("WEIGHT", 452, 260, 14, UI.black, "left", 900);
      label(`${weightKg} kg`, 548, 260, 15, UI.blue, "left", 900);

      const genus = species?.genera?.find(g => g.language.name === "en")?.genus || "Unknown Pokémon";
      fitText(genus, 452, 282, 260, 14, UI.black, "left", 900);

      const flavor = species?.flavor_text_entries
        ?.find(entry => entry.language.name === "en")
        ?.flavor_text
        ?.replace(/[\n\f]/g, " ") ||
        "No field notes available for this Pokémon.";
      wrapText(flavor, 452, 444, 280, 18, 0, 14);

      rect(438, 320, 306, 106, UI.white, UI.black, 3);
      drawStats(pokemon.stats);

      const flavorBoxY = 220;
      rect(438, flavorBoxY, 306, 88, UI.white, UI.black, 3);
      label("PROFILE", 452, flavorBoxY + 12, 14, UI.red, "left", 900);
      wrapText(flavor, 452, flavorBoxY + 34, 276, 16, 3, 12);

      applyAtkinsonDither();
    }

    function nearestPaletteColor(r, g, b) {
      let best = PALETTE[0];
      let bestDistance = Infinity;
      for (const color of PALETTE) {
        const dr = r - color[0];
        const dg = g - color[1];
        const db = b - color[2];
        const distance = dr * dr + dg * dg + db * db;
        if (distance < bestDistance) {
          bestDistance = distance;
          best = color;
        }
      }
      return best;
    }

    function applyAtkinsonDither() {
      const imageData = ctx.getImageData(0, 0, W, H);
      const data = imageData.data;
      const buffer = new Float32Array(data.length);

      for (let i = 0; i < data.length; i++) buffer[i] = data[i];

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const oldR = buffer[i];
          const oldG = buffer[i + 1];
          const oldB = buffer[i + 2];
          const next = nearestPaletteColor(oldR, oldG, oldB);
          const errR = (oldR - next[0]) / 8;
          const errG = (oldG - next[1]) / 8;
          const errB = (oldB - next[2]) / 8;

          buffer[i] = next[0];
          buffer[i + 1] = next[1];
          buffer[i + 2] = next[2];

          const offsets = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];
          for (const [dx, dy] of offsets) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
              const ni = (ny * W + nx) * 4;
              buffer[ni] += errR;
              buffer[ni + 1] += errG;
              buffer[ni + 2] += errB;
            }
          }
        }
      }

      for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.max(0, Math.min(255, Math.round(buffer[i])));
        data[i + 1] = Math.max(0, Math.min(255, Math.round(buffer[i + 1])));
        data[i + 2] = Math.max(0, Math.min(255, Math.round(buffer[i + 2])));
        data[i + 3] = 255;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function safeApplyAtkinsonDither() {
      try {
        applyAtkinsonDither();
      } catch (error) {
        console.warn("Dither skipped:", error);
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function main() {
      drawLoading();
      try {
        const pokemonId = Math.floor(Math.random() * 1025) + 1;
        const pokemon = await fetchJson(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
        const species = await fetchJson(pokemon.species.url);

        // Render text and stats immediately; artwork can load in the background.
        drawInfo(pokemon, species, null);

        const img = await loadFirstAvailableImage(imageCandidates(pokemon.sprites, pokemon.id), 3500);
        if (img) drawInfo(pokemon, species, img);
      } catch (error) {
        console.error(error);
        drawError("Could not load Pokémon data from PokeAPI. Check network access, then reload.");
      }
    }

    main();
  </script>
</body>
</html>
