name: Update weather data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore generated weather history
        run: |
          if git fetch origin weather-data:refs/remotes/origin/weather-data; then
            git show origin/weather-data:weather-bias-history.json > "$RUNNER_TEMP/weather-bias-history.json" || rm -f "$RUNNER_TEMP/weather-bias-history.json"
          fi

      - name: Generate weather data
        env:
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
          WEATHER_HISTORY_PATH: ${{ runner.temp }}/weather-bias-history.json
        run: node scripts/update-weather.mjs

      - name: Publish same-origin weather fallback
        env:
          GH_TOKEN: ${{ github.token }}
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
        run: |
          cp "$WEATHER_OUTPUT_DIR"/weather.json weather.json

          if git diff --quiet -- weather.json; then
            echo "Same-origin weather fallback is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "chore: refresh same-origin weather fallback"

          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "Main changed while publishing; rebasing attempt $attempt"
            git fetch origin main
            git rebase origin/main
          done

          if [ "$pushed" != true ]; then
            echo "Could not publish same-origin weather fallback"
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Publish generated weather branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
        run: |
          rm -rf "$RUNNER_TEMP/weather-data-branch"
          mkdir -p "$RUNNER_TEMP/weather-data-branch"
          cp "$WEATHER_OUTPUT_DIR"/weather.json "$RUNNER_TEMP/weather-data-branch/weather.json"
          cp "$WEATHER_OUTPUT_DIR"/weather-bias.json "$RUNNER_TEMP/weather-data-branch/weather-bias.json"
          cp "$WEATHER_OUTPUT_DIR"/weather-bias-history.json "$RUNNER_TEMP/weather-data-branch/weather-bias-history.json"

          cd "$RUNNER_TEMP/weather-data-branch"
          git init
          git checkout -b weather-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json weather-bias.json weather-bias-history.json
          git commit -m "chore: update generated weather data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:weather-data
