name: Update weather data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Best-effort scheduling: four off-hour opportunities to recover from a missed run.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify weather and publication contracts
        run: |
          node --test scripts/test-fetch-json.mjs scripts/test-weather-bias.mjs scripts/test-update-sensor.mjs scripts/test-prepare-pages-site.mjs scripts/test-weather-workflow.mjs
          node scripts/test-weather-periods.mjs
          node --test scripts/test-dashboard-recovery.mjs

      - name: Restore generated weather history
        run: |
          if git fetch origin weather-data:refs/remotes/origin/weather-data; then
            git show origin/weather-data:weather-bias-history.json > "$RUNNER_TEMP/weather-bias-history.json" || rm -f "$RUNNER_TEMP/weather-bias-history.json"
          fi

      - name: Generate weather data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REQUIRE_OPENWEATHER_API_KEY: 'true'
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
          WEATHER_HISTORY_PATH: ${{ runner.temp }}/weather-bias-history.json
        run: node scripts/update-weather.mjs

      - name: Generate SenseCraft sensor snapshot
        id: sensor
        continue-on-error: true
        env:
          SENSECRAFT_API_KEY: ${{ secrets.SENSECRAFT_API_KEY }}
          SENSOR_OUTPUT_DIR: ${{ runner.temp }}/weather-data
        run: node scripts/update-sensor.mjs

      - name: Record unavailable sensor
        if: steps.sensor.outcome == 'failure'
        run: |
          echo '::warning::SenseCraft snapshot unavailable; publishing fresh weather without sensor readings.'
          echo 'null' > "$RUNNER_TEMP/weather-data/sensor.json"

      - name: Summarize data freshness
        env:
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const weather = JSON.parse(readFileSync(`${process.env.WEATHER_OUTPUT_DIR}/weather.json`, 'utf8'));
          const sensor = JSON.parse(readFileSync(`${process.env.WEATHER_OUTPUT_DIR}/sensor.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Weather generated: ${weather.generated_at}\n\nObservation (local): ${weather.current.time}\n\nSensor: ${sensor?.generated_at || 'unavailable'}\n`);
          JS

      - name: Publish generated weather branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEATHER_OUTPUT_DIR: ${{ runner.temp }}/weather-data
        run: |
          rm -rf "$RUNNER_TEMP/weather-data-branch"
          mkdir -p "$RUNNER_TEMP/weather-data-branch"
          cp "$WEATHER_OUTPUT_DIR"/weather.json "$RUNNER_TEMP/weather-data-branch/weather.json"
          cp "$WEATHER_OUTPUT_DIR"/weather-bias.json "$RUNNER_TEMP/weather-data-branch/weather-bias.json"
          cp "$WEATHER_OUTPUT_DIR"/weather-bias-history.json "$RUNNER_TEMP/weather-data-branch/weather-bias-history.json"
          cp "$WEATHER_OUTPUT_DIR"/sensor.json "$RUNNER_TEMP/weather-data-branch/sensor.json"

          cd "$RUNNER_TEMP/weather-data-branch"
          git init
          git checkout -b weather-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json weather-bias.json weather-bias-history.json sensor.json
          git commit -m "chore: update generated weather data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:weather-data

      - name: Prepare Pages artifact
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/pages-site
          WEATHER_PATH: ${{ runner.temp }}/weather-data/weather.json
          SENSOR_PATH: ${{ runner.temp }}/weather-data/sensor.json
        run: node scripts/prepare-pages-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  deploy-pages:
    needs: update-weather
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
